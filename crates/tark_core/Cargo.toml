[package]
name = "tark_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust acceleration core for Tark AI tutor"

[lib]
name = "tark_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"], optional = true }
regex = "1.10"

[features]
default = ["python"]
python = ["dep:pyo3"]

